name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install Playwright browsers
      run: playwright install chromium
    
    - name: Run ruff (linting)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      run: ruff check .

    - name: Run black (format check)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      run: black --check .
    
    - name: Run mypy (type checking)
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      run: mypy markdown_ingress tests
    
    - name: Run pytest with coverage
      run: python -m pytest -q -m "not baseline and not campaign" --cov=markdown_ingress --cov-report=term-missing --cov-report=xml
      env:
        PYTEST_TIMEOUT: 300
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
      continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit[toml] safety
    
    - name: Run bandit security linter
      run: bandit -r markdown_ingress/ -ll

    - name: Run safety check
      run: safety check

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Check package
      run: twine check dist/*

    - name: Smoke test wheel install
      run: |
        python -m venv .pkg-smoke
        . .pkg-smoke/bin/activate
        python -m pip install --upgrade pip
        pip install dist/*.whl
        python -c "import markdown_ingress; print(markdown_ingress.__version__)"
        markdown-ingress --version

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ github.sha }}
        path: dist/
        retention-days: 30
