name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest      # Linux x64
          - ubuntu-24.04-arm   # Linux arm64
          - windows-latest     # Windows x64
          - windows-11-arm     # Windows arm64
          - macos-15-intel     # macOS x64 (Intel)
          - macos-latest       # macOS arm64 (Apple Silicon)
        python-version: ["3.13", "3.14"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install Playwright browsers
      run: playwright install chromium
    
    - name: Run ruff (linting)
      if: matrix.runner == 'ubuntu-latest' && matrix.python-version == '3.13'
      run: ruff check .

    - name: Run black (format check)
      if: matrix.runner == 'ubuntu-latest' && matrix.python-version == '3.13'
      run: black --check .

    - name: Run mypy (type checking)
      if: matrix.runner == 'ubuntu-latest' && matrix.python-version == '3.13'
      run: mypy markdown_ingress tests
    
    - name: Run pytest with coverage
      run: python -m pytest -q -m "not baseline and not campaign" --cov=markdown_ingress --cov-report=term-missing --cov-report=xml
      env:
        PYTEST_TIMEOUT: 300
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      if: matrix.runner == 'ubuntu-latest' && matrix.python-version == '3.13'
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
      continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[api,render]" bandit[toml] pip-audit
    
    - name: Run bandit security linter
      run: bandit -q -r markdown_ingress

    - name: Run dependency vulnerability audit
      run: pip-audit . --skip-editable --progress-spinner off

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Check package
      run: twine check dist/*

    - name: Smoke test wheel install
      run: |
        python -m venv .pkg-smoke
        . .pkg-smoke/bin/activate
        python -m pip install --upgrade pip
        pip install dist/*.whl
        python -c "import markdown_ingress; print(markdown_ingress.__version__)"
        markdown-ingress --version

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist-${{ github.sha }}
        path: dist/
        retention-days: 30
