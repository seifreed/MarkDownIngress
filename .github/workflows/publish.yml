name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, release, and publish
    runs-on: ubuntu-latest
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" bandit[toml] build twine

    - name: Install Playwright browsers
      run: playwright install chromium

    - name: Run ruff
      run: ruff check .

    - name: Run black
      run: black --check .

    - name: Run mypy
      run: mypy markdown_ingress tests

    - name: Run bandit
      run: bandit -q -r markdown_ingress

    - name: Run tests
      run: python -m pytest -q -m "not baseline and not campaign"
    
    - name: Build package
      run: python -m build
    
    - name: Check package
      run: twine check dist/*

    - name: Create GitHub release assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag="${GITHUB_REF_NAME}"
        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
        else
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$tag" \
            --generate-notes
        fi
    
    - name: Publish to PyPI
      if: env.PYPI_TOKEN != ''
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ env.PYPI_TOKEN }}
      run: twine upload dist/*
