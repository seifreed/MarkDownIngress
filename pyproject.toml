[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["markdown_ingress*"]

[project]
name = "markdown-ingress"
version = "0.8.0"
description = "Deterministic, Injection-Resistant Web → Markdown Engine for LLM Pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Marc Rivero", email = "mriverolopez@gmail.com"}
]
keywords = ["markdown", "web-scraping", "llm", "security", "injection-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Security",
]

dependencies = [
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "readability-lxml>=0.8.1",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.12.1",
    "tiktoken>=0.7.0",
    "PyYAML>=6.0",      # v0.4: Config file support
    "rich>=14.0",       # v0.4: CLI progress bars
    "langdetect>=1.0.9", # v0.6: Language detection for metadata
]

[project.urls]
Homepage = "https://github.com/seifreed/MarkDownIngress"
Repository = "https://github.com/seifreed/MarkDownIngress"
Issues = "https://github.com/seifreed/MarkDownIngress/issues"
Documentation = "https://github.com/seifreed/MarkDownIngress/blob/main/README.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.6",
    "black>=23.11.0",
    "mypy>=1.7.1",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "playwright>=1.43.0",
    "nova-hunting>=0.1.0",
]
render = [
    "playwright>=1.43.0",
]
security = [
    "nova-hunting>=0.1.0",
]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
]
all = [
    "nova-hunting>=0.1.0",
    "playwright>=1.43.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.6",
    "black>=23.11.0",
    "mypy>=1.7.1",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
markdown-ingress = "markdown_ingress.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
addopts = "--cov=markdown_ingress --cov-report=term-missing --cov-report=html"
filterwarnings = [
    "ignore:This process .* is multi-threaded, use of fork\\(\\) may lead to deadlocks in the child\\.:DeprecationWarning:multiprocessing.popen_fork",
]
markers = [
    "baseline: large opt-in baseline tests against external datasets",
    "network: tests that require live external network access",
    "campaign: massive live-network campaign tests against external datasets",
]

[tool.coverage.run]
source = ["markdown_ingress"]
omit = ["*/tests/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # gradual typing
