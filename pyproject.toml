[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-ingress"
version = "0.4.1"
description = "Deterministic, Injection-Resistant Web → Markdown Engine for LLM Pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MarkDownIngress Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "readability-lxml>=0.8.1",
    "markdownify>=0.12.1",
    "tiktoken>=0.7.0",
    "PyYAML>=6.0",      # v0.4: Config file support
    "rich>=14.0",       # v0.4: CLI progress bars
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]
render = [
    "playwright>=1.43.0",
]
all = [
    "playwright>=1.43.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
markdown-ingress = "markdown_ingress.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
