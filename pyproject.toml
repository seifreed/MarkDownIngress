[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["mcp_server"]

[tool.setuptools.packages.find]
include = ["markdown_ingress*"]

[tool.setuptools.package-data]
"markdown_ingress.rules" = ["*.nova"]

[project]
name = "markdown-ingress"
version = "2.0.0"
description = "Deterministic, Injection-Resistant Web → Markdown Engine for LLM Pipelines"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
authors = [
    {name = "Marc Rivero Lopez", email = "mriverolopez@gmail.com"}
]
maintainers = [
    {name = "Marc Rivero Lopez", email = "mriverolopez@gmail.com"}
]
keywords = ["markdown", "web-scraping", "llm", "security", "injection-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Security",
]

dependencies = [
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
    "readability-lxml>=0.8.1",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.12.1",
    "tiktoken>=0.7.0",
    "PyYAML>=6.0",      # v0.4: Config file support
    "rich>=14.0",       # v0.4: CLI progress bars
    "langdetect>=1.0.9", # v0.6: Language detection for metadata
]

[project.urls]
Homepage = "https://github.com/seifreed/MarkDownIngress"
Repository = "https://github.com/seifreed/MarkDownIngress"
Issues = "https://github.com/seifreed/MarkDownIngress/issues"
Documentation = "https://github.com/seifreed/MarkDownIngress/blob/main/README.md"
"Author GitHub (@seifreed)" = "https://github.com/seifreed"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.14",
    "black>=26.5.1",
    "mypy>=2.1.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "playwright>=1.43.0",
]
render = [
    "playwright>=1.43.0",
]
security = [
    "nova-hunting>=0.1.0",
]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
]
mcp = [
    "mcp>=1.2.0",
]
all = [
    "nova-hunting>=0.1.0",
    "playwright>=1.43.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.14",
    "black>=26.5.1",
    "mypy>=2.1.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "mcp>=1.2.0",
]

[project.scripts]
markdown-ingress = "markdown_ingress.cli:main"
markdown-ingress-mcp = "mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
addopts = "--cov=markdown_ingress --cov-report=term-missing --cov-report=html"
filterwarnings = [
    "ignore:This process .* is multi-threaded, use of fork\\(\\) may lead to deadlocks in the child\\.:DeprecationWarning:multiprocessing.popen_fork",
]
markers = [
    "baseline: large opt-in baseline tests against external datasets",
    "network: tests that require live external network access",
    "campaign: massive live-network campaign tests against external datasets",
]

[tool.coverage.run]
source = ["markdown_ingress"]
omit = ["*/tests/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# vulture_whitelist.py is a vulture allowlist, not importable source: it lists
# bare symbol names that are unresolved by design, so ruff's F821 is spurious.
extend-exclude = ["vulture_whitelist.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.black]
line-length = 100
target-version = ['py313', 'py314']

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # gradual typing

# Optional extra: the MCP server (mcp_server.py) depends on the untyped, optional
# `mcp` package, which is not installed in the default dev/CI environment.
[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true
